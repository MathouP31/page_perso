# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: sb2nov
  page:
    size: a4
    show_footer: false
    show_top_note: false
  text:
    font_size: 9.5pt
    leading: 0.5em
  header:
    name_font_size: 24pt
    vertical_space_between_name_and_connections: 0.3cm
    vertical_space_between_connections_and_first_section: 0.35cm
  section_titles:
    vertical_space_above: 0.3cm
    vertical_space_below: 0.15cm
  entries:
    vertical_space_between_entries: 0.8em
  highlights:
    top_margin: 0.15cm
    vertical_space_between_highlights: 0.15cm
